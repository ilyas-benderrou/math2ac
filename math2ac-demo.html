<html lang="fr">
<head>

<title>Math 2AC – Évalue ta compréhension</title>

window.MathJax = {

    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => {

<style>
:root{
  --bg:#F3F6FB; --paper:#FFFFFF; --ink:#1D2552; --muted:#5D6587; --line:#DCE2EE;
  --good:#1E9A60; --good-soft:#E2F5EA; --bad:#D4443C; --bad-soft:#FCE7E5;
  --warn:#E3A21A; --stamp:#C4312A; --owl:#3C6BD3; --owl-soft:#E6EEFC;
  --radius-lg:22px; --radius-md:14px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#141A33; --paper:#1D2443; --ink:#EEF1FB; --muted:#A9B0CF; --line:#2E3760;
  --good-soft:#163B2D; --bad-soft:#47201E; --owl-soft:#22305E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Baloo Bhaijaan 2", "Segoe UI", Tahoma, system-ui, sans-serif;
  font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--owl);outline-offset:2px}
mjx-container{direction:ltr;unicode-bidi:isolate}
mjx-container[display="true"]{margin:.4em 0 !important}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.ar{direction:rtl;text-align:right}

/* ---------- Owl tutor ---------- */
.tutor{display:flex;gap:12px;align-items:flex-end;margin:6px 0 18px}
.owl{width:74px;height:74px;flex:0 0 auto;transform-origin:50% 90%}
.owl.happy{animation:hop .6s ease}
.owl.sad{animation:wobble .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-6deg)}65%{transform:translateY(0) rotate(4deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.owl .eye-open{display:block}.owl .eye-happy{display:none}
.owl.happy .eye-open,.owl.proud .eye-open{display:none}
.owl.happy .eye-happy,.owl.proud .eye-happy{display:block}
.bubble{
  position:relative;flex:1;background:var(--paper);border:2px solid var(--owl);
  border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:17px;font-weight:500;
  box-shadow:0 3px 0 var(--owl-soft);
}
.bubble .who{display:block;font-size:13px;color:var(--owl);font-weight:700;margin-bottom:2px}
.bubble.pop{animation:pop .28s ease}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- Home ---------- */
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
.brand h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.icon-btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;width:42px;height:42px;font-size:19px;display:grid;place-items:center}
.name-row{display:flex;gap:8px;margin:4px 0 22px}
.name-row input{
  flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 14px;border-radius:var(--radius-md);
  border:2px solid var(--line);background:var(--paper);color:var(--ink)
}
.domain{
  background:var(--paper);border-radius:var(--radius-lg);margin-bottom:18px;overflow:hidden;
  border:2px solid var(--line);
}
.domain-head{background:var(--dc);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.domain-head h2{margin:0;font-size:21px;font-weight:800;line-height:1.2}
.domain-head span{font-size:16px;font-weight:600;opacity:.95}
.parcours-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.pc{
  position:relative;border:2px solid var(--dc);background:var(--ds);border-radius:16px;
  padding:12px 8px 10px;text-align:center;font-weight:700;min-height:92px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .12s ease;
}
.pc:active{transform:scale(.97)}
.pc .pn{font-size:15px;color:var(--ink)}
.pc .big{font-size:26px;line-height:1;color:var(--dc)}
.pc .meta{font-size:13px;color:var(--muted);font-weight:600}
.pc.locked{border-style:dashed;border-color:var(--line);background:transparent;cursor:not-allowed;color:var(--muted)}
.pc.locked .big{color:var(--muted)}
.mini-visa{
  position:absolute;top:-8px;right:-6px;transform:rotate(12deg);font-size:11px;font-weight:800;
  color:var(--stamp);border:2px solid var(--stamp);border-radius:5px;padding:0 5px;background:var(--paper)
}
.note{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}

/* ---------- Quiz ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:17px;line-height:1.2}
.topbar .t small{color:var(--muted);font-size:14px}
.streak{font-weight:800;color:#E5641E;font-size:17px;min-width:48px;text-align:right}
.streak.flash{animation:hop .5s ease}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--dc);border-radius:99px;transition:width .4s ease}
.qcount{font-size:14px;color:var(--muted);margin-bottom:12px}
.card{background:var(--paper);border-radius:var(--radius-lg);padding:16px 16px 18px;border:2px solid var(--line);border-bottom-width:5px}
.chip{display:inline-block;background:var(--ds);color:var(--ink);border-radius:10px;padding:3px 10px;font-size:14px;font-weight:600;margin-bottom:10px;border:1.5px solid var(--dc)}
.qtext{font-size:20px;font-weight:600;line-height:1.45;margin:0 0 6px}
.fig{display:flex;justify-content:center;margin:8px 0 2px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;
  padding:12px 14px;font-size:20px;min-height:62px;transition:transform .1s ease,border-color .15s ease;
}
.opt:hover:not(:disabled){border-color:var(--dc)}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt .l{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:800;background:var(--bg);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;animation:shake .35s ease}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.exp{margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:var(--bg);border-left:5px solid var(--good);font-size:18px}
.exp b{display:block;font-size:14px;color:var(--good)}
.cta{
  display:block;width:100%;margin-top:16px;border:0;border-radius:16px;padding:14px;
  background:var(--dc,var(--owl));color:#fff;font-size:19px;font-weight:800;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.cta.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none}

/* ---------- Results ---------- */
.score{text-align:center;margin:4px 0 14px}
.score .pct{font-size:58px;font-weight:800;line-height:1;color:var(--dc)}
.stars{font-size:34px;letter-spacing:4px;margin-top:4px}
.stars .off{filter:grayscale(1);opacity:.3}
.grid{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.grid th,.grid td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid th{font-size:13px;color:var(--muted);font-weight:600;text-align:center;background:var(--ds)}
.grid th:first-child{text-align:left}
.grid td.c{font-size:15px;line-height:1.35}
.grid td.c small{display:block;color:var(--muted);font-size:13px}
.grid td.s{text-align:center;width:44px}
.face{width:30px;height:30px;opacity:.16;filter:grayscale(1)}
.face.on{opacity:1;filter:none;animation:pop .35s ease}
.stamp-zone{position:relative;height:0}
.visa{
  position:absolute;right:6px;top:-30px;transform:rotate(-12deg);
  border:4px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:2px 12px 4px;
  font-weight:800;font-size:30px;letter-spacing:3px;background:rgba(255,255,255,.75);
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.5s;line-height:1.1;text-align:center
}
.visa small{display:block;font-size:11px;letter-spacing:.5px}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.review{margin-top:16px;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius-lg);padding:12px 16px}
.review h3{margin:0 0 6px;font-size:18px}
.review ul{margin:0;padding-left:20px}
.review li{margin:4px 0;font-size:15px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .confetti{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<script>
/* ===================== helpers ===================== */
const fr = (a,b) => `$\\frac{${a}}{${b}}$`;
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function typeset(el){
  if(!el) return;
  if(window.__mjReady && window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([el]).catch(()=>{}); }
  else { (window.__mjQueue = window.__mjQueue || []).push(el); }
}

/* Number line: parts between 0 and 1, points [[tick,label],...] */
function NL(parts, pts){
  const x0=24,x1=296,y=56,step=(x1-x0)/parts;
  let s=`<svg viewBox="0 0 320 96" width="320" role="img" aria-label="Droite graduée de 0 à 1 partagée en ${parts} parts">`;
  s+=`<line x1="8" y1="${y}" x2="312" y2="${y}" stroke="currentColor" stroke-width="2.5"/>`;
  s+=`<path d="M312 ${y} l-9 -5 v10 z" fill="currentColor"/>`;
  for(let k=0;k<=parts;k++){
    const x=x0+k*step, big=(k===0||k===parts);
    s+=`<line x1="${x}" y1="${y-(big?11:7)}" x2="${x}" y2="${y+(big?11:7)}" stroke="currentColor" stroke-width="${big?3:2}"/>`;
  }
  s+=`<text x="${x0}" y="${y+32}" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">0</text>`;
  s+=`<text x="${x1}" y="${y+32}" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">1</text>`;
  pts.forEach(([k,lab])=>{
    const x=x0+k*step;
    s+=`<circle cx="${x}" cy="${y}" r="6" fill="var(--dc)"/>`;
    s+=`<text x="${x}" y="${y-18}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--dc)">${lab}</text>`;
  });
  return s+`</svg>`;
}

/* Graph of f through given integer points, x 0..4, y 0..4 */
function GRAPH(points){
  const ox=40, oy=210, u=46;
  const X=v=>ox+v*u, Y=v=>oy-v*u;
  let s=`<svg viewBox="0 0 280 245" width="280" role="img" aria-label="Courbe de la fonction f">`;
  for(let i=0;i<=4;i++){
    s+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(4.3)}" stroke="var(--line)" stroke-width="1.5"/>`;
    s+=`<line x1="${X(0)}" y1="${Y(i)}" x2="${X(4.6)}" y2="${Y(i)}" stroke="var(--line)" stroke-width="1.5"/>`;
  }
  s+=`<line x1="${X(-.2)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(0)}" stroke="currentColor" stroke-width="2.5"/>`;
  s+=`<path d="M${X(5)} ${Y(0)} l-9 -5 v10 z" fill="currentColor"/>`;
  s+=`<line x1="${X(0)}" y1="${Y(-.2)}" x2="${X(0)}" y2="${Y(4.6)}" stroke="currentColor" stroke-width="2.5"/>`;
  s+=`<path d="M${X(0)} ${Y(4.6)} l-5 9 h10 z" fill="currentColor"/>`;
  for(let i=1;i<=4;i++){
    s+=`<text x="${X(i)}" y="${Y(0)+22}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${i}</text>`;
    s+=`<text x="${X(0)-12}" y="${Y(i)+6}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${i}</text>`;
  }
  s+=`<text x="${X(0)-12}" y="${Y(0)+22}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">0</text>`;
  s+=`<polyline points="${points.map(([a,b])=>X(a)+','+Y(b)).join(' ')}" fill="none" stroke="var(--dc)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  points.forEach(([a,b])=>{ s+=`<circle cx="${X(a)}" cy="${Y(b)}" r="4.5" fill="var(--dc)"/>`; });
  s+=`<text x="${X(4.15)}" y="${Y(.6)}" font-size="17" font-weight="800" font-style="italic" fill="var(--dc)">C</text><text x="${X(4.15)+12}" y="${Y(.6)+5}" font-size="12" font-weight="800" font-style="italic" fill="var(--dc)">f</text>`;
  return s+`</svg>`;
}
const F_POINTS=[[0,2],[1,4],[2,3],[3,1],[4,0]];

/* ===================== content =====================
   Each question: c = index of competency, q = question,
   o = options (first one is the correct answer; wrong ones carry the tutor's explanation),
   hint = tip after a first mistake, exp = worked correction. */
const DOMAINS = [
{
  id:'frac', name:'Fractions', ar:'الكسور', color:'#D18A1E', soft:'#FCF1DB',
  parcours:{1:{
    comps:[
      ['Lire et placer des abscisses fractionnaires entre 0 et 1','p. 6 et 8'],
      ['Additionner et soustraire des fractions de dénominateurs différents','p. 10'],
      ['Multiplier deux fractions','p. 13'],
      ['Modéliser une situation par une seule fraction','p. 16']
    ],
    qs:[
      {c:0,q:"Quelle est l'abscisse du point $A$ ?",fig:NL(5,[[3,'A']]),
       o:[[fr(3,5)],[fr(3,6),"عديتي الخطوط (6) بلاصة الأجزاء. المقام هو عدد الأجزاء المتساوية بين 0 و 1، يعني 5."],[fr(5,3),"قلبتي الكسر! البسط هو عدد الأجزاء لي وصلنا ليهم (3)، والمقام هو عدد الأجزاء كاملين (5)."]],
       hint:"عد الأجزاء المتساوية بين 0 و 1، ماشي الخطوط.",
       exp:"L'unité est partagée en $5$ parts égales et $A$ est à $3$ parts de $0$ : $A\\left(\\frac{3}{5}\\right)$."},
      {c:0,q:"Quelle est l'abscisse du point $B$ ?",fig:NL(8,[[6,'B']]),
       o:[[fr(3,4)],[fr(6,9),"9 هو عدد الخطوط، ماشي عدد الأجزاء. كاينين 8 ديال الأجزاء."],[fr(2,8),"عديتي من جهة 1! ديما كنبداو العد من 0."]],
       hint:"شحال من جزء كاين بين 0 و 1؟ ومن بعد بسّط الكسر.",
       exp:"$B$ est à $6$ parts sur $8$ : $\\frac{6}{8}=\\frac{3}{4}$."},
      {c:0,q:"Quel point a pour abscisse $\\frac{1}{2}$ ?",fig:NL(4,[[1,'P'],[2,'Q'],[3,'R']]),
       o:[["Le point $Q$"],["Le point $P$","النقطة P عندها $\\frac{1}{4}$: جزء واحد من 4. و $\\frac{1}{2}$ هي نص الوحدة."],["Le point $R$","النقطة R عندها $\\frac{3}{4}$، يعني فايتة النص."]],
       hint:"$\\frac{1}{2}=\\frac{2}{4}$ — قلّب على النقطة لي فالنص.",
       exp:"$\\frac{1}{2}=\\frac{2}{4}$ : c'est le point $Q$, au milieu entre $0$ et $1$."},

      {c:1,q:"Calcule : $\\frac{1}{2}+\\frac{1}{3}$",
       o:[[fr(5,6)],[fr(2,5),"ما كنجمعوش البسط مع البسط والمقام مع المقام! خصنا نوحدو المقامات أولا."],[fr(2,6),"وحّدتي المقام مزيان (6)، ولكن نسيتي تبدل البسوط: $\\frac{1}{2}=\\frac{3}{6}$ و $\\frac{1}{3}=\\frac{2}{6}$."]],
       hint:"وحّد المقامات: شنو هو أصغر عدد كيتقسم على 2 و 3؟",
       exp:"$\\frac{1}{2}+\\frac{1}{3}=\\frac{3}{6}+\\frac{2}{6}=\\frac{5}{6}$"},
      {c:1,q:"Calcule : $\\frac{3}{4}-\\frac{1}{8}$",
       o:[[fr(5,8)],[fr(2,8),"طرحتي البسوط بلا ما تحول $\\frac{3}{4}$ لـ $\\frac{6}{8}$."],[fr(1,2),"خلّيتي المقام 4 وطرحتي $3-1$. خصك تحول للمقام 8 أولا."]],
       hint:"$\\frac{3}{4}=\\frac{?}{8}$",
       exp:"$\\frac{3}{4}-\\frac{1}{8}=\\frac{6}{8}-\\frac{1}{8}=\\frac{5}{8}$"},
      {c:1,q:"Calcule : $\\frac{2}{3}+\\frac{1}{4}$",
       o:[[fr(11,12)],[fr(3,7),"جمعتي البسوط والمقامات مباشرة. خصنا مقام مشترك: 12."],[fr(3,12),"المقام 12 صحيح، ولكن خصك تضرب البسوط: $\\frac{2}{3}=\\frac{8}{12}$ و $\\frac{1}{4}=\\frac{3}{12}$."]],
       hint:"المقام المشترك ديال 3 و 4 هو 12.",
       exp:"$\\frac{2}{3}+\\frac{1}{4}=\\frac{8}{12}+\\frac{3}{12}=\\frac{11}{12}$"},

      {c:2,q:"Calcule : $\\frac{2}{3}\\times\\frac{4}{5}$",
       o:[[fr(8,15)],[fr(6,8),"هادي جمعتيها! فالضرب كنضربو البسط × البسط والمقام × المقام."],[fr(10,12),"ضربتي بالتقاطع ($2\\times5$ و $3\\times4$)، هادي ماشي قاعدة الضرب."]],
       hint:"البسط × البسط، والمقام × المقام.",
       exp:"$\\frac{2}{3}\\times\\frac{4}{5}=\\frac{2\\times4}{3\\times5}=\\frac{8}{15}$"},
      {c:2,q:"Calcule et simplifie : $\\frac{3}{4}\\times\\frac{2}{9}$",
       o:[[fr(1,6)],[fr(6,13),"البسط صحيح ($3\\times2=6$) ولكن المقامات كيتضربو ماشي كيتجمعو: $4\\times9=36$."],[fr(27,8),"هادي قسمة ماشي ضرب: قلبتي الكسر الثاني."]],
       hint:"احسب $\\frac{3\\times2}{4\\times9}$ ومن بعد بسّط.",
       exp:"$\\frac{3}{4}\\times\\frac{2}{9}=\\frac{6}{36}=\\frac{1}{6}$"},
      {c:2,q:"Calcule : $5\\times\\frac{2}{7}$",
       o:[[fr(10,7)],[fr(10,35),"ضربتي البسط والمقام بجوج فـ 5! هكا رجعتي لنفس الكسر $\\frac{2}{7}$."],[fr(2,35),"العدد 5 كيتضرب فالبسط ماشي فالمقام."]],

/* ===================== sound ===================== */
let actx=null;
function tone(freqs, dur=.12, type='sine', gap=.09){
  if(store.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*gap;
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
    });
  }catch(e){}
}
const sfx = {
  good:()=>tone([660,880],.16),
  bad:()=>tone([220,180],.18,'triangle',.12),
  win:()=>tone([523,659,784,1046],.22,'sine',.13)
};

/* ===================== confetti ===================== */
function confetti(n=26){
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#D18A1E','#DD6430','#AE4068','#3C6BD3','#1E9A60','#F2C230'];
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=pick(cols);
    p.style.animationDelay=(Math.random()*.25)+'s';
    p.style.animationDuration=(1+Math.random()*.7)+'s';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),2200);
}

function startQuiz(di,p){
  const d=DOMAINS[di], pc=d.parcours[p];
  // keep competencies in order, shuffle questions inside each competency, shuffle options
  const qs=[];
  pc.comps.forEach((_,ci)=>{
    shuffle(pc.qs.filter(q=>q.c===ci)).forEach(q=>{
      const opts=shuffle(q.o.map((o,k)=>({t:o[0],why:o[1]||null,ok:k===0})));
      qs.push(Object.assign({},q,{opts}));
    });
  });
  Q={di,p,d,pc,qs,i:0,tries:0,scores:[],streak:0,maxStreak:0,done:false};
  document.documentElement.style.setProperty('--dc',d.color);
  renderQuestion(true);
}

function renderQuestion(first){
  const {d,pc,qs,i}=Q, q=qs[i];
  Q.tries=0; Q.done=false;
  const pct=Math.round(i/qs.length*100);
  const intro = first
    ? `يلا نبداو ${d.ar}! ${qs.length} ديال الأسئلة. ركز مزيان، وإلا غلطتي غادي نعاونك 😉`
    : pick(["سؤال جديد، يلا! 💪","ركز مزيان فهادا 🧐","كمّل، راك ماشي مزيان! 🚀","هاد السؤال ليك 😉"]);
  $('#view').innerHTML = `
  <div style="--dc:${d.color};--ds:${d.soft}">
    <div class="topbar">
      <button class="icon-btn" id="quit" aria-label="Retour à l'accueil">✕</button>
      <div class="t"><b>${d.name}</b><small>Parcours ${Q.p}</small></div>
      <div class="streak" id="streak">${Q.streak>=2?'🔥 '+Q.streak:''}</div>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qcount">Question ${i+1} sur ${qs.length}</div>
    <div class="card">
      <span class="chip">${pc.comps[q.c][0]}</span>
      <p class="qtext">${q.q}</p>
      ${q.fig?`<div class="fig">${q.fig}</div>`:''}
      <div class="opts" id="opts">
        ${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABC'[k]}</span><span>${o.t}</span></button>`).join('')}
      </div>
      <div id="after"></div>
    </div>
    ${tutorBlock(intro)}
  </div>`;
  typeset($('#view'));
  $('#quit').onclick=()=>{ if(confirm('Quitter le parcours ? Ta progression sera perdue.')) renderHome(); };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  window.scrollTo(0,0);
}

function answer(k,btn){
  if(Q.done) return;
  const q=Q.qs[Q.i], o=q.opts[k];
  Q.tries++;
  if(o.ok){
    btn.classList.add('correct');
    const pts = Q.tries===1 ? 1 : .5;
    Q.scores.push(pts);
    finishQuestion(q);
    sfx.good();
    if(Q.tries===1){
      Q.streak++; Q.maxStreak=Math.max(Q.maxStreak,Q.streak);
      let msg = (store.name && Math.random()<.4) ? pick(SAY.correctName(store.name)) : pick(SAY.correct);
      if(SAY.streak[Q.streak]){ msg=SAY.streak[Q.streak]; confetti(40); } else confetti(18);
      say(msg,'happy');
      const st=$('#streak'); st.textContent=Q.streak>=2?'🔥 '+Q.streak:''; st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
    } else {
      Q.streak=0; $('#streak').textContent='';
      say(pick(SAY.second),'happy');
    }
  } else {
    btn.classList.add('wrong'); btn.disabled=true;
    sfx.bad(); Q.streak=0; $('#streak').textContent='';
    if(Q.tries===1){
      say(`${pick(SAY.retryLead)} ${o.why}<br><b>💡 ${q.hint}</b>`,'sad');
    } else {
      Q.scores.push(0);
      const good=[...document.querySelectorAll('.opt')].find(b=>q.opts[+b.dataset.k].ok);
      good.classList.add('correct');
      say(`${o.why} ${pick(SAY.reveal)}`,'sad');
      finishQuestion(q);
    }
  }
}

function finishQuestion(q){
  Q.done=true;
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(!b.classList.contains('correct')&&!b.classList.contains('wrong')) b.classList.add('dim'); });
  const last = Q.i===Q.qs.length-1;
  const a=$('#after');
  a.innerHTML=`<div class="exp"><b>Correction</b>${q.exp}</div>
    <button class="cta" id="next">${last?'Voir mon résultat':'Question suivante'}</button>`;
  typeset(a);
  $('#next').onclick=()=>{ if(last) renderResults(); else { Q.i++; renderQuestion(false); } };
  setTimeout(()=>$('#next').scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}

function level(r){ return r>=.75?0:(r>=.5?1:2); } // 0 green, 1 yellow, 2 red
function faceSVG(kind,on){
  const col=['#2E9B57','#E9B92A','#D8433B'][kind];
  const mouth=['M11 19 q5 5 10 0','M11 20 h10','M11 21 q5 -5 10 0'][kind];
  return `<svg class="face ${on?'on':''}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="${col}"/>
    <circle cx="11.5" cy="13" r="2" fill="#1D2552"/><circle cx="20.5" cy="13" r="2" fill="#1D2552"/>
    <path d="${mouth}" stroke="#1D2552" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
}

function renderResults(){
  const {d,pc,qs,scores,p}=Q;
  const total=scores.reduce((a,b)=>a+b,0);
  const pct=Math.round(total/qs.length*100);
  const compRatios=pc.comps.map((_,ci)=>{
    let s=0,n=0; qs.forEach((q,k)=>{ if(q.c===ci){ s+=scores[k]; n++; } }); return n?s/n:0;
  });
  const levels=compRatios.map(level);
  const visa = pct>=75 && !levels.includes(2);
  const stars = pct>=90?3:pct>=70?2:pct>=40?1:0;

  const key=d.id+'-'+p, prev=store.best[key];
  if(!prev || pct>=prev.pct) store.best[key]={pct,visa:visa||(prev&&prev.visa)||false,date:Date.now()};
  else if(visa) store.best[key].visa=true;
  save();

  let msg;
  if(pct>=90) msg="تبارك الله عليك! نتيجة واعرة بزاف 🏆 راك فاهم هاد المجال مزيان.";
  else if(pct>=75) msg="برافو عليك! خدمة زوينة 👏 راجع غير الكفايات الصفرة وغادي تولّي بطل.";
  else if(pct>=50) msg="مزيان! راك فالطريق الصحيح 💪 شوف الكفايات لي خاصك تراجع وعاود.";
  else msg="ما تقلقش، التعلم كيبدا هكا 🌱 راجع الدرس مع التصحيحات وعاود المحاولة، أنا معاك!";
  if(store.name) msg = `${store.name}، ` + msg;
  if(visa) msg += "<br><b>ربحتي الـ VISA ديال هاد الپاركور! 🎉</b>";

  const toReview = pc.comps.map((c,ci)=>({c,l:levels[ci]})).filter(x=>x.l>0);

  $('#view').innerHTML=`
  <div style="--dc:${d.color};--ds:${d.soft}">
    <div class="topbar">
      <button class="icon-btn" id="home" aria-label="Accueil">⌂</button>
      <div class="t"><b>${d.name}</b><small>Parcours ${p} terminé</small></div>
    </div>
    ${tutorBlock(msg)}
    <div class="score">
      <div class="pct">${pct}%</div>
      <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
      <div class="qcount">Meilleure série : ${Q.maxStreak} bonne${Q.maxStreak>1?'s':''} réponse${Q.maxStreak>1?'s':''} d'affilée</div>
    </div>
    <div class="stamp-zone">${visa?`<div class="visa">VISA<small>${d.name.split(' ')[0]} P${p}</small></div>`:''}</div>
    <div style="overflow-x:auto">
    <table class="grid">
      <thead><tr><th>Compétence</th><th>Acquis</th><th>En cours</th><th>À revoir</th></tr></thead>
      <tbody>
      ${pc.comps.map((c,ci)=>`<tr><td class="c">${c[0]}<small>${Math.round(compRatios[ci]*100)}% de réussite</small></td>
        ${[0,1,2].map(k=>`<td class="s">${faceSVG(k,levels[ci]===k)}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
    ${toReview.length?`<div class="review"><h3>À réviser dans le cahier</h3><ul>
      ${toReview.map(x=>`<li>${x.c[0]} : ${x.c[1]}</li>`).join('')}</ul></div>`:''}
    <div class="btn-row" style="margin-top:18px">
      <button class="cta ghost" id="home2">Accueil</button>
      <button class="cta" id="again">Rejouer</button>
    </div>
  </div>`;
  typeset($('#view'));
  say(msg, pct>=50?'proud':'');
  sfx.win(); if(pct>=75) confetti(60);
  $('#home').onclick=renderHome; $('#home2').onclick=renderHome;
  $('#again').onclick=()=>startQuiz(Q.di,Q.p);
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
